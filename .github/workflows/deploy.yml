name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p deploy
          cp public/*.html deploy/
          cp -r public/css public/js deploy/
          if [ -d public/images ]; then cp -r public/images deploy/; fi
          touch deploy/.nojekyll
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then BASE_HREF="/"; else BASE_HREF="/${REPO_NAME}/"; fi
          for f in deploy/*.html; do
            sed -i "s|<head>|<head><base href=\"${BASE_HREF}\">|" "$f"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
