<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window.__PORTFOLIO_API_BASE__="https://nodejsportfolio-production.up.railway.app";</script>
    <meta name="api-base" content="https://nodejsportfolio-production.up.railway.app">
    <title>Meals | Humphrey Okoth</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">Humphrey Okoth</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/recipes" class="active">Meals</a></li>
                <li><a href="/dashboard">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Meals</h1>
                <p>Sign in or create an account to manage your meal list.</p>
            </div>
        </section>

        <section class="section">
            <div class="container" style="max-width: 960px;">
                <!-- If static site is on another host, set API origin (see contact.html). -->
                <div class="card" id="recipeAuthPanel" style="padding: 18px;">
                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
                        <button type="button" class="btn btn-primary" id="recipeTabLogin" aria-pressed="true">Sign in</button>
                        <button type="button" class="btn btn-outline" id="recipeTabSignup" aria-pressed="false">Create account</button>
                    </div>
                    <div id="recipeLoginSection">
                        <h2 style="margin-top:0;">Sign in</h2>
                        <form id="recipeLoginForm" class="contact-form" style="max-width: 420px;">
                            <div class="form-group">
                                <label for="recipeLoginUsername">Username</label>
                                <input type="text" id="recipeLoginUsername" name="username" autocomplete="username" required>
                            </div>
                            <div class="form-group">
                                <label for="recipeLoginPassword">Password</label>
                                <input type="password" id="recipeLoginPassword" name="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="recipeLoginSubmit">Sign in</button>
                            <p class="form-status" id="recipeLoginStatus" aria-live="polite" style="margin-top:12px;"></p>
                        </form>
                    </div>
                    <div id="recipeSignupSection" hidden>
                        <h2 style="margin-top:0;">Create account</h2>
                        <form id="recipeSignupForm" class="contact-form" style="max-width: 420px;">
                            <div class="form-group">
                                <label for="recipeSignupUsername">Username</label>
                                <input type="text" id="recipeSignupUsername" name="username" autocomplete="username" minlength="2" required>
                            </div>
                            <div class="form-group">
                                <label for="recipeSignupPassword">Password (min 8 characters)</label>
                                <input type="password" id="recipeSignupPassword" name="password" autocomplete="new-password" minlength="8" required>
                            </div>
                            <div class="form-group">
                                <label for="recipeSignupPassword2">Confirm password</label>
                                <input type="password" id="recipeSignupPassword2" name="password2" autocomplete="new-password" minlength="8" required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="recipeSignupSubmit">Create account</button>
                            <p class="form-status" id="recipeSignupStatus" aria-live="polite" style="margin-top:12px;"></p>
                        </form>
                    </div>
                </div>

                <div id="recipePlannerPanel" hidden>
                <div class="card" style="padding: 14px 18px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px;">
                    <span id="recipeAuthGreeting" style="opacity:.9; font-size:14px;"></span>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button type="button" class="btn btn-outline" id="recipeExportXlsx">Download Excel report</button>
                        <button type="button" class="btn btn-outline" id="recipeLogoutBtn">Sign out</button>
                    </div>
                </div>

                <div class="card" style="padding: 18px;">
                    <h2 style="margin-top:0;">Add or edit a meal</h2>
                    <form id="recipeForm" class="contact-form" style="max-width: 720px;">
                        <div class="form-group">
                            <label for="mealType">Meal</label>
                            <select id="mealType" name="mealType" required style="width:100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,.12);">
                                <option value="breakfast">Breakfast</option>
                                <option value="lunch">Lunch</option>
                                <option value="dinner">Dinner</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="title">Food</label>
                            <input type="text" id="title" name="title" placeholder="e.g., Oatmeal + banana" required>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes (optional)</label>
                            <textarea id="notes" name="notes" rows="3" placeholder="Short notes, ingredients, or why it's good..."></textarea>
                        </div>

                        <div class="form-group">
                            <label for="recipeImage">Photo (optional, max 5MB)</label>
                            <input type="file" id="recipeImage" name="image" accept="image/jpeg,image/png,image/gif,image/webp">
                        </div>

                        <div class="form-group">
                            <label for="recipeImageUrl">Or image link (optional)</label>
                            <input type="url" id="recipeImageUrl" name="imageUrl" placeholder="https://example.com/photo.jpg">
                        </div>

                        <div class="form-group" id="recipeClearImageWrap" hidden>
                            <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                                <input type="checkbox" id="recipeClearImage" name="clearImage" value="1">
                                Remove current image
                            </label>
                        </div>

                        <div id="recipeImagePreview" style="margin-bottom:12px; display:none;">
                            <span style="font-size:13px; opacity:.85;">Preview</span><br>
                            <img id="recipeImagePreviewImg" alt="" style="max-width:100%; max-height:220px; border-radius:10px; margin-top:6px; object-fit:cover;">
                        </div>

                        <button type="submit" class="btn btn-primary btn-full" id="recipeSubmit">Add</button>
                        <p class="form-status" id="recipeStatus" aria-live="polite" style="margin-top:12px;"></p>
                    </form>
                </div>

                <div style="height:20px;"></div>

                <div class="card" style="padding: 18px;">
                    <h2 style="margin-top:0;">Your meals</h2>

                    <div style="display:flex; gap:10px; flex-wrap:wrap; margin: 12px 0 16px;">
                        <button class="btn btn-outline" type="button" data-filter="all">All</button>
                        <button class="btn btn-outline" type="button" data-filter="breakfast">Breakfast</button>
                        <button class="btn btn-outline" type="button" data-filter="lunch">Lunch</button>
                        <button class="btn btn-outline" type="button" data-filter="dinner">Dinner</button>
                    </div>

                    <div id="recipesList"></div>
                </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>humphrey okoth &copy; 2026. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script type="module" src="/js/recipes.js?v=4"></script>
</body>
</html>
